name: Precios NL y BE

on:
  schedule:
    - cron: "10 5 * * *"     # 07:10 en España (verano)
    - cron: "10 16 * * *"    # 18:10 en España (verano)
  workflow_dispatch:

permissions:
  contents: write

concurrency:                  # evita que dos ejecuciones se pisen
  group: precios
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar el recolector
        run: python collector/collect.py

      - name: Guardar el resultado
        run: |
          if [ ! -f precios.json ]; then
            echo "No se ha generado precios.json"; exit 0
          fi
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add precios.json
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"; exit 0
          fi
          git commit -m "Precios $(date -u +%Y-%m-%d\ %H:%M) UTC"
          # Traer lo que haya subido mientras tanto y reintentar
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Reintento $i"
            sleep 5
          done
          echo "No se ha podido guardar"; exit 1
