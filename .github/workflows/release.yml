name: Publicar version

# Cada etiqueta vX (por ejemplo v2026.10.10) publica una release con:
#   surtidor-app.zip   el mapa, el servidor, el recolector y el panel (lo que Surtidor.exe se baja solo)
#   Surtidor.exe       el lanzador compilado en Windows (solo hay que bajarlo una vez)
# Mismo mecanismo que el Catalogator.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Etiqueta de la version (vAAAA.MM.DD)"
        required: true

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        id: v
        shell: bash
        run: |
          V="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ github.event.inputs.version }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "EXE_VERSION = \"$V\"" > surtidor_version.py
      - name: Librerias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest httpx
      - name: Pruebas (si falla alguna, no se publica)
        run: python -m pytest tests -q
      - name: Zip de la app
        run: python empaquetar.py ${{ steps.v.outputs.version }}
      - name: Compilar Surtidor.exe
        run: pyinstaller --noconfirm surtidor.spec
      - name: Comprobar que el exe arranca el servidor y el panel responde
        shell: pwsh
        run: |
          $env:SURTIDOR_DIR = "$env:RUNNER_TEMP\surtidor-prueba\app"
          $p = Start-Process -FilePath ".\dist\Surtidor.exe" -ArgumentList "--consola" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8766/salud" -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          $mapa = $null; $panel = $null
          if ($ok) {
            $mapa = (Invoke-WebRequest -Uri "http://127.0.0.1:8766/" -UseBasicParsing).Content
            $panel = (Invoke-WebRequest -Uri "http://127.0.0.1:8766/admin" -UseBasicParsing).StatusCode
          }
          Get-Process -Name Surtidor -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content "$env:SURTIDOR_DIR\surtidor.log" -ErrorAction SilentlyContinue
          if (-not $ok) { throw "El exe no ha levantado el servidor" }
          if ($mapa -notmatch "window.SURTIDOR") { throw "El mapa no lleva los ajustes locales" }
          if ($panel -ne 200) { throw "El panel no responde" }
          Write-Host "El exe arranca, sirve el mapa y el panel"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          name: ${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: |
            dist/surtidor-app.zip
            dist/Surtidor.exe
